<!DOCTYPE html>
<html>
<head>
  <title>Study Quest 🎮</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dff3ff, #f5e6ff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat {
      background: #f5f5ff;
      padding: 12px;
      border-radius: 15px;
      text-align: center;
      font-weight: bold;
    }

    .question {
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0;
    }

    .option {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 2px solid #ddd;
      border-radius: 14px;
      background: white;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
    }

    .option:hover {
      background: #f2edff;
    }

    .correct {
      background: #d9ffd9 !important;
      border-color: green;
    }

    .wrong {
      background: #ffdada !important;
      border-color: red;
    }

    .next {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 15px;
      background: #7c4dff;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .next:disabled {
      background: #bbb;
    }

    .message {
      text-align: center;
      font-weight: bold;
      min-height: 25px;
      margin-top: 12px;
    }

    .progress {
      height: 10px;
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: #7c4dff;
      transition: 0.3s;
    }

    .result {
      text-align: center;
      display: none;
    }

    .restart {
      padding: 14px 25px;
      border: none;
      border-radius: 14px;
      background: #7c4dff;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="game">

  <h1>🎮 Study Quest</h1>
  <div class="subtitle">Learn • Play • Level Up 🚀</div>

  <div class="stats">
    <div class="stat">⭐<br><span id="score">0</span><br>Points</div>
    <div class="stat">❤️<br><span id="lives">3</span><br>Lives</div>
    <div class="stat">🔥<br><span id="streak">0</span><br>Streak</div>
  </div>

  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>

  <div id="gameArea">

    <div class="question" id="question"></div>

    <div id="options"></div>

    <div class="message" id="message"></div>

    <button class="next" id="next" disabled>
      Next Question ➜
    </button>

  </div>

  <div class="result" id="result">
    <h2>🏆 Quest Complete!</h2>
    <h3>Your Score</h3>
    <h1 id="finalScore">0</h1>
    <p>Great job! 🎉</p>

    <button class="restart" onclick="restartGame()">
      🔄 Play Again
    </button>
  </div>

</div>

<script>

const questions = [

  {
    question: "What does HTML stand for?",
    options: [
      "Hyper Text Markup Language",
      "High Text Machine Language",
      "Hyperlink Text Mark Language",
      "Home Tool Markup Language"
    ],
    answer: 0
  },

  {
    question: "Which language is used to style a webpage?",
    options: [
      "Java",
      "CSS",
      "C",
      "SQL"
    ],
    answer: 1
  },

  {
    question: "Which language is used to make webpages interactive?",
    options: [
      "JavaScript",
      "HTML",
      "SQL",
      "MS Word"
    ],
    answer: 0
  },

  {
    question: "What is the full form of CPU?",
    options: [
      "Central Processing Unit",
      "Computer Personal Unit",
      "Central Program Utility",
      "Control Processing Unit"
    ],
    answer: 0
  },

  {
    question: "Which of these is a database language?",
    options: [
      "SQL",
      "HTML",
      "CSS",
      "C"
    ],
    answer: 0
  }

];

let current = 0;
let score = 0;
let lives = 3;
let streak = 0;
let answered = false;

const question = document.getElementById("question");
const options = document.getElementById("options");
const message = document.getElementById("message");
const next = document.getElementById("next");

function loadQuestion() {

  if (lives <= 0) {
    gameOver();
    return;
  }

  answered = false;
  next.disabled = true;
  message.innerHTML = "";

  const q = questions[current];

  question.innerHTML =
    "❓ " + q.question;

  options.innerHTML = "";

  q.options.forEach((option, index) => {

    const button = document.createElement("button");

    button.className = "option";
    button.innerHTML = option;

    button.onclick = () => checkAnswer(index, button);

    options.appendChild(button);
  });

  document.getElementById("bar").style.width =
    ((current / questions.length) * 100) + "%";
}

function checkAnswer(selected, button) {

  if (answered) return;

  answered = true;

  const correct = questions[current].answer;
  const allButtons = document.querySelectorAll(".option");

  allButtons.forEach(btn => btn.disabled = true);

  if (selected === correct) {

    score += 10;
    streak++;

    button.classList.add("correct");

    message.innerHTML =
      "🎉 Correct! +10 points";

  } else {

    lives--;
    streak = 0;

    button.classList.add("wrong");
    allButtons[correct].classList.add("correct");

    message.innerHTML =
      "❌ Not quite! Try to remember the correct answer.";
  }

  document.getElementById("score").innerHTML = score;
  document.getElementById("lives").innerHTML = lives;
  document.getElementById("streak").innerHTML = streak;

  next.disabled = false;
}

next.onclick = function() {

  current++;

  if (current >= questions.length) {
    finishGame();
  } else {
    loadQuestion();
  }
};

function finishGame() {

  document.getElementById("gameArea").style.display = "none";
  document.getElementById("result").style.display = "block";

  document.getElementById("finalScore").innerHTML =
    score + " ⭐";
}

function gameOver() {

  document.getElementById("gameArea").style.display = "none";
  document.getElementById("result").style.display = "block";

  document.getElementById("finalScore").innerHTML =
    score + " ⭐";

}

function restartGame() {

  current = 0;
  score = 0;
  lives = 3;
  streak = 0;

  document.getElementById("score").innerHTML = 0;
  document.getElementById("lives").innerHTML = 3;
  document.getElementById("streak").innerHTML = 0;

  document.getElementById("gameArea").style.display = "block";
  document.getElementById("result").style.display = "none";

  loadQuestion();
}

loadQuestion();

</script>

</body>
  </html>
